# Idle management (hypridle). Conservative, mainstream-OS-like defaults:
# dim -> screen off -> lock -> suspend, all respecting idle inhibitors (so media
# playback, etc. won't dim or suspend the machine). Vendor-neutral: nothing here
# is Intel/AMD specific.
general {
    lock_cmd         = pidof breadlock || breadlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = ~/.local/bin/bos-dpms on
    ignore_dbus_inhibit = false
}

# Dim the backlight after 5 minutes (restored on activity). No-op on hardware
# without a backlight (desktops / VMs).
listener {
    timeout    = 300
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# Turn the display off after 8 minutes. Keep the command as a wrapper invocation:
# hypridle 0.1.8 launches listener commands verbatim through /bin/sh -c, while
# Hyprland's Lua config requires the explicit hyprctl eval dispatcher expression.
listener {
    timeout    = 480
    on-timeout = ~/.local/bin/bos-dpms off
    on-resume  = ~/.local/bin/bos-dpms on
}

# Lock shortly before the screen turns off.
listener {
    timeout    = 470
    on-timeout = loginctl lock-session
}

# Suspend after 20 minutes of inactivity (skipped while something inhibits idle).
listener {
    timeout    = 1200
    on-timeout = systemctl suspend
}
