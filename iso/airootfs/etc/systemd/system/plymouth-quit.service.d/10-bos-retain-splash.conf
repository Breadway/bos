# Hand the boot splash straight to the greeter with no blank-tty flash.
#
# Stock plymouth-quit.service runs `plymouth quit`, which clears the
# framebuffer. greetd.service is ordered After=plymouth-quit-wait.service, so
# the sequence is: splash torn down -> bare tty1 visible -> greetd starts cage
# -> breadgreet paints. That middle step is the console flash.
#
# `--retain-splash` leaves plymouth's last frame in the framebuffer when the
# daemon exits, so nothing writes to tty1 in the gap: the splash image just
# stays until cage's first modeset draws over it.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
