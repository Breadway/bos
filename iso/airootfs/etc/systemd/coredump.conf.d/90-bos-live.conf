# Live medium: never write a core dump into the writable overlay.
#
# The overlay is a RAM-backed cow space. A crash-looping service can fill it and
# make the whole live session unusable (BOS-99: 192 breadcrumbs cores in about
# 45 minutes). The installed system keeps systemd's default policy.
[Coredump]
Storage=none
ProcessSizeMax=0
ExternalSizeMax=0
