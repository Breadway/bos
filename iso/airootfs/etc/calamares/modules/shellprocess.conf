---
# BOS finalization, run after the native initcpio + bootloader modules. It
# checks that boot-critical artifacts were created, then performs remaining
# setup such as live-medium cleanup, snapper, services, and dotfiles.
# A generous timeout is kept as a safety margin. Critical finalization failures
# return non-zero so Calamares shows its error page instead of success.
timeout: 600
script:
  - "/usr/bin/bash /etc/calamares/post-install.sh"
