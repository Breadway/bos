---
defaultGroups:
  - name: users
    must_exist: true
    system: false
  - name: lp
    must_exist: false
    system: true
  - name: video
    must_exist: false
    system: true
  - name: network
    must_exist: false
    system: true
  - name: storage
    must_exist: false
    system: true
  - name: wheel
    must_exist: false
    system: true
  - name: audio
    must_exist: false
    system: true
  - name: input
    must_exist: false
    system: true

autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: true

passwordRequirements:
  minLength: 6
  maxLength: -1
  libpwquality:
    - minlen=6

allowWeakPasswords: false

# `userShell` (top-level) is not a real key in this Calamares version's users
# module schema (3.4.2) — it's silently ignored, and an installed user gets
# whatever the module's own default is (bash), confirmed on real hardware.
# The actual key is nested: user.shell. See /usr/share/calamares/modules/users.conf
# for the documented schema.
user:
  shell: /usr/bin/zsh
