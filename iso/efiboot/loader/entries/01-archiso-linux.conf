# INERT: bootmodes in iso/profiledef.sh builds bios.syslinux and uefi.grub
# only, so mkarchiso never reads this file and nothing here reaches a boot.
# The live cmdline lives in iso/grub/grub.cfg, iso/grub/loopback.cfg and
# iso/syslinux/archiso_sys-linux.cfg. Kept for a possible uefi.systemd-boot.
title    Bread OS install medium (%ARCH%, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=25% quiet splash vt.global_cursor_default=0 systemd.show_status=false rd.systemd.show_status=false rd.udev.log_level=3
