# INERT: bootmodes in iso/profiledef.sh builds bios.syslinux and uefi.grub
# only, so mkarchiso never reads this file and nothing here reaches a boot.
# The live cmdline lives in iso/grub/grub.cfg, iso/grub/loopback.cfg and
# iso/syslinux/archiso_sys-linux.cfg. Kept for a possible uefi.systemd-boot.
title    Memtest86+
sort-key 03
efi      /boot/memtest86+/memtest.efi
architecture x64
