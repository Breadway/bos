# Bakery binaries baked into the live/installed image at /usr/local.
#
# build-local.sh and CI (scripts/ci-stage-bakery.py) read this file. A missing
# *required* binary fails the bake: a hollow ISO is worse than a failed build.
# optional_bins are baked when the verified stable index publishes them, and
# skipped with a warning when it does not. bread 0.8.0 ships bread-emit and
# bread-module-host, so those are required_bins.
#
# A flat `bins` list is still accepted and treated as required_bins.
#
# CI and default local builds populate a temporary home from the
# minisign-verified stable bakery index (https://dl.breadway.dev/index.json).
# Optional [versions] or [[pin]] tables with package and version pin bakery
# package versions so two ISO bakes of the same git commit fetch the same
# bits:
#   https://dl.breadway.dev/<pkg>/<ver>/...
# Bump pins after new bakery stables land. CI and default local builds stage
# these pinned versions. `BAKE_FROM_HOME=1` is an opt-in local development
# override that uses whatever is installed on the builder.
#
# Not shipped (even if they appear in the index): breadcast, breadarr,
# breadsearch/breadmill (semantic search is opt-in: `bakery install
# breadsearch` pulls both binaries and the breadmill.service unit).
# breadmon is deprecated and no longer baked into the image.
# breadlock is pacman (see packages.x86_64), not bakery.

required_bins = [
  "bakery",
  "bread",
  "breadd",
  "bread-emit",
  "bread-module-host",
  "breadman",
  "breadbar",
  "breadbox",
  "breadbox-sync",
  "breadcrumbs",
  "breadpad",
  "breadpaper",
  "bread-theme",
  "breadclip",
  "breadclipd",
  "breadshot",
  "bos-settings",
  "breadhelp",
]

# Optional bins are staged when the signed stable index publishes them and
# skipped with a warning when it does not, so an index that has not caught up
# yet cannot fail a build. breadhelp-tour is the GTK4 tour overlay packaged
# with breadhelp 0.3.0 and newer. Once the breadhelp pin below reaches 0.3.0,
# scripts/ci-stage-bakery.py turns a missing tour into a bake error (BOS-105).
optional_bins = [
  "breadhelp-tour",
]

# Package name → version. Must exist at dl.breadway.dev/<pkg>/<ver>/ and
# should match the signed index so CI can verify sha256.
# [[pin]] { package, version } is accepted as well and merged (conflict = bake error).
[versions]
bakery = "0.8.0"
bread = "0.9.0"
bread-theme = "0.8.0"
breadbar = "0.4.0"
breadbox = "0.4.0"
breadcrumbs = "2.2.0"
breadpad = "0.6.0"
breadpaper = "0.2.0"
breadclip = "0.3.0"
breadshot = "0.1.3"
bos-settings = "0.9.0"
# 0.2.7 is the newest stable bakery release. Bump to 0.3.0 or newer, keeping
# breadhelp-tour in optional_bins above, once the signed stable index publishes
# it; until then the optional tour bin is skipped with a warning (BOS-105).
breadhelp = "0.2.7"
