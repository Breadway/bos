name: Build and publish calamares

# Calamares is AUR-only (not in Arch's official repos), so BOS maintains an
# in-house PKGBUILD and publishes the built package to the [breadway] repo.
on:
  push:
    # Build work branches for validation. Only main can publish packages.
    branches: ['main', 'fix/**', 'feature/**']
    paths:
      - 'packaging/calamares/**'
  pull_request:
    branches: ['main']
    paths:
      - 'packaging/calamares/**'
  workflow_dispatch:

jobs:
  calamares:
    runs-on: [self-hosted]
    container:
      image: archlinux:latest
    steps:
      - name: Build package
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm base-devel git python nodejs cmake ninja \
            extra-cmake-modules qt6-tools qt6-translations libglvnd \
            kcoreaddons kpmcore libpwquality qt6-declarative qt6-svg yaml-cpp
          useradd -m builder
          git config --global --add safe.directory '*'
          # Fetch the exact triggering ref. For pull_request events this is
          # the PR merge ref, while push and dispatch events use branch refs.
          git clone --no-checkout \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" /home/builder/src
          git -C /home/builder/src fetch --depth=1 origin "${GITHUB_REF}"
          git -C /home/builder/src checkout --detach FETCH_HEAD
          chown -R builder:builder /home/builder/src
          su builder -c "cd /home/builder/src/packaging/calamares && makepkg -f --noconfirm --nocheck"
          PKG=$(find /home/builder/src/packaging/calamares -name '*.pkg.tar.zst' ! -name '*-debug-*' | head -1)
          python3 /home/builder/src/scripts/package-provenance.py record "$PKG" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$(git -C /home/builder/src rev-parse HEAD)" \
            --workflow calamares.yml --run-id "$GITHUB_RUN_ID" > "$PKG.provenance.json"

      - name: Publish package
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          PKG=$(find /home/builder/src/packaging/calamares -name '*.pkg.tar.zst' ! -name '*-debug-*' | head -1)
          code=$(curl -sS -o /tmp/pkg-upload.body -w "%{http_code}" -X PUT \
            -H "Authorization: token ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${PKG}" \
            "https://git.breadway.dev/api/packages/Breadway/arch/os")
          case "$code" in
            200|201|204) echo "published ${PKG} ($code)" ;;
            409) echo "already in registry: ${PKG}" ;;
            *) echo "upload failed HTTP ${code}"; cat /tmp/pkg-upload.body; exit 1 ;;
          esac

      - name: Save unapproved build provenance for review
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: calamares-build-provenance
          path: /home/builder/src/packaging/calamares/*.provenance.json
          if-no-files-found: error
