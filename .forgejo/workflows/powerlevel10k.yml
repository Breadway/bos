name: Build and publish powerlevel10k

# Powerlevel10k (the BOS default zsh prompt) is AUR-only, so BOS maintains an
# in-house PKGBUILD and publishes the built package to the [breadway] repo.
# Builds gitstatus + libgit2 from source, so it needs cmake + zsh beyond base-devel.
on:
  push:
    # Without branches:, tag pushes also match this path filter.
    branches: ['**']
    paths:
      - 'packaging/powerlevel10k/**'
  workflow_dispatch:

jobs:
  powerlevel10k:
    runs-on: [self-hosted]
    container:
      image: archlinux:latest
    steps:
      - name: Build and publish
        env:
          PUBLISH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm base-devel git cmake zsh
          useradd -m builder
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" /home/builder/src
          chown -R builder:builder /home/builder/src
          su builder -c "cd /home/builder/src/packaging/powerlevel10k && makepkg -f --noconfirm --nocheck"
          PKG=$(find /home/builder/src/packaging/powerlevel10k -name '*.pkg.tar.zst' ! -name '*-debug-*' | head -1)
          code=$(curl -sS -o /tmp/pkg-upload.body -w "%{http_code}" -X PUT \
            -H "Authorization: token ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${PKG}" \
            "https://git.breadway.dev/api/packages/Breadway/arch/os")
          case "$code" in
            200|201|204) echo "published ${PKG} ($code)" ;;
            409) echo "already in registry: ${PKG}" ;;
            *) echo "upload failed HTTP ${code}"; cat /tmp/pkg-upload.body; exit 1 ;;
          esac
