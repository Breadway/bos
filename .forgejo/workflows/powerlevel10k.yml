name: Build and publish powerlevel10k

# Powerlevel10k (the BOS default zsh prompt) is AUR-only, so BOS maintains an
# in-house PKGBUILD and publishes the built package to the [breadway] repo.
# Builds gitstatus + libgit2 from source, so it needs cmake + zsh beyond base-devel.
on:
  push:
    # Path-only triggers also fire on tags. Restrict to work branches so
    # ISO's force-push of `stable` (the release marker) does not republish.
    branches: ['main', 'fix/**', 'feature/**']
    paths:
      - 'packaging/powerlevel10k/**'
  workflow_dispatch:

jobs:
  powerlevel10k:
    runs-on: [self-hosted]
    container:
      image: archlinux:latest
    steps:
      - name: Build and publish
        env:
          PUBLISH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm base-devel git python nodejs cmake zsh
          useradd -m builder
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" /home/builder/src
          chown -R builder:builder /home/builder/src
          su builder -c "cd /home/builder/src/packaging/powerlevel10k && makepkg -f --noconfirm --nocheck"
          PKG=$(find /home/builder/src/packaging/powerlevel10k -name '*.pkg.tar.zst' ! -name '*-debug-*' | head -1)
          python3 /home/builder/src/scripts/package-provenance.py record "$PKG" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$(git -C /home/builder/src rev-parse HEAD)" \
            --workflow powerlevel10k.yml --run-id "$GITHUB_RUN_ID" > "$PKG.provenance.json"
          code=$(curl -sS -o /tmp/pkg-upload.body -w "%{http_code}" -X PUT \
            -H "Authorization: token ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${PKG}" \
            "https://git.breadway.dev/api/packages/Breadway/arch/os")
          case "$code" in
            200|201|204) echo "published ${PKG} ($code)" ;;
            409) echo "already in registry: ${PKG}" ;;
            *) echo "upload failed HTTP ${code}"; cat /tmp/pkg-upload.body; exit 1 ;;
          esac

      - name: Save unapproved build provenance for review
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: powerlevel10k-build-provenance
          path: /home/builder/src/packaging/powerlevel10k/*.provenance.json
          if-no-files-found: error
