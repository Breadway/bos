name: Build and publish bibata-cursor-theme

# Bibata is AUR-only (not in Arch's official repos), so BOS maintains an
# in-house PKGBUILD and publishes the built package to the [breadway] repo.
# It's the prebuilt -bin variant, so no build deps beyond base-devel.
on:
  push:
    # Path-only triggers also fire on tags. Restrict to work branches so
    # ISO's force-push of `stable` (the release marker) does not republish.
    branches: ['main', 'fix/**', 'feature/**']
    paths:
      - 'packaging/bibata/**'
  workflow_dispatch:

jobs:
  bibata:
    runs-on: [self-hosted]
    container:
      image: archlinux:latest
    steps:
      - name: Build and publish
        env:
          PUBLISH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm base-devel git
          useradd -m builder
          git config --global --add safe.directory '*'
          # Clone the branch that triggered this run (not the default branch),
          # so the package can be built/published from a feature branch.
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" /home/builder/src
          chown -R builder:builder /home/builder/src
          su builder -c "cd /home/builder/src/packaging/bibata && makepkg -f --noconfirm --nocheck"
          PKG=$(find /home/builder/src/packaging/bibata -name '*.pkg.tar.zst' ! -name '*-debug-*' | head -1)
          code=$(curl -sS -o /tmp/pkg-upload.body -w "%{http_code}" -X PUT \
            -H "Authorization: token ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${PKG}" \
            "https://git.breadway.dev/api/packages/Breadway/arch/os")
          case "$code" in
            200|201|204) echo "published ${PKG} ($code)" ;;
            409) echo "already in registry: ${PKG}" ;;
            *) echo "upload failed HTTP ${code}"; cat /tmp/pkg-upload.body; exit 1 ;;
          esac
