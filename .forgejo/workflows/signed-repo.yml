name: Prepare unsigned [breadway] candidate

# No signing private key is available to Actions. This job downloads an unsigned
# candidate for offline review. Only a dedicated non-runner signing host may run
# the publisher with its local repository key. See docs/signed-repo.md.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-signed-repo]
  workflow_run:
    workflows:
      - Build and publish calamares
      - Build and publish bibata-cursor-theme
      - Build and publish powerlevel10k
      - Build and publish yay-bin
      - Build and publish latest Zen Browser
    types: [completed]

concurrency:
  group: signed-repo
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: [self-hosted]
    steps:
      - name: Clone repository
        run: |
          set -euo pipefail
          rm -rf src
          git clone --depth 1 --branch main \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: Collect unsigned candidate
        run: |
          set -euo pipefail
          BREADWAY_COLLECT_ONLY=1 BREADWAY_DEST="$PWD/candidate" \
            bash src/scripts/ci-publish-signed-repo.sh

      - name: Save unsigned candidate for offline review
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: unsigned-breadway-candidate
          path: candidate/
          if-no-files-found: error
