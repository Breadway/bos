name: Build and release ISO

# Builds the BOS ISO on the self-hosted runner (native Arch container).
# Stages bakery desktop apps from the *minisign-verified* stable index at
# https://dl.breadway.dev/index.json (see iso/bread-lockfile.toml), then runs
# build-local.sh and uploads the ISO to a Forgejo release. A matching GitHub
# release is created best-effort and points at Forgejo for the download
# (GitHub releases cannot host files larger than 2 GB).
#
# Signing is deliberately outside Actions. The privileged ISO builder has no
# signing private key. It uploads an unsigned draft candidate for an offline
# release signer; docs/signed-repo.md describes verification and activation.
# Required secret: RELEASE_TOKEN (draft release upload only).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v0.4.0)'
        required: true

jobs:
  release-iso:
    runs-on: [self-hosted]
    container:
      # Floating tag: this environment cannot pin a reproducible digest of
      # archlinux:latest. Do not invent one.
      image: archlinux:latest
      # --privileged: mkarchiso needs CAP_SYS_ADMIN for loop mounts + mknod
      # --network=host: gives localhost:7218 access to Forgejo (avoids the
      #   public git.breadway.dev → Aegis → Tailscale round-trip for pacman)
      options: --privileged --network=host

    steps:
      - name: Install build dependencies
        run: |
          # Fresh archlinux:latest has no pacman master key. --init before
          # pacman -Syu so the keyring hook can lsign, and so build-local.sh
          # can --lsign-key the [breadway] repo key. Kept in the workflow (not
          # only in build-local.sh) so workflow_dispatch from a later main can
          # rebuild an older tag whose build-local.sh does not init yet.
          pacman-key --init
          # grub is required by profiledef.sh bootmodes=('uefi.grub'):
          # mkarchiso validates grub-install on the *builder*, not the image.
          # archiso pulls syslinux/squashfs-tools/libisoburn; it does not pull grub.
          pacman -Syu --noconfirm archiso grub curl python git minisign

      - name: Determine tag and version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Clone repository at tag
        run: |
          git clone --branch "${{ steps.vars.outputs.tag }}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" /bos

      - name: Stage bakery ecosystem from signed stable index
        run: |
          set -euo pipefail
          cd /bos
          LAPTOP_HOME=/build-home python3 scripts/ci-stage-bakery.py

      - name: Verify staged bakery bake inputs
        run: |
          set -euo pipefail
          cd /bos
          LAPTOP_HOME=/build-home bash scripts/ci-verify-bake.sh

      - name: Build ISO
        run: |
          set -euo pipefail
          mkdir -p /bos-work /bos-out
          cd /bos
          LAPTOP_HOME=/build-home \
          WORK=/bos-work \
          OUT=/bos-out \
          CI_BUILD=1 \
          bash build-local.sh
          ls -lh /bos-out/*.iso

      - name: Checksum unsigned ISO candidate
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          ISO=$(ls /bos-out/*.iso | head -1)
          ISO_NAME="bos-${VERSION}-x86_64.iso"
          cd /bos-out
          mv "$(basename "$ISO")" "$ISO_NAME"
          sha256sum "$ISO_NAME" > SHA256SUMS
          cat SHA256SUMS

      - name: Create unsigned draft candidate and upload assets
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${{ steps.vars.outputs.version }}"
          ISO_NAME="bos-${VERSION}-x86_64.iso"

          # Candidates are immutable. Re-running a tag must never replace a
          # candidate that an offline operator may already have approved.
          RELEASE_HTTP=$(curl -sS -o /tmp/existing-release.json -w '%{http_code}' \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "http://localhost:7218/api/v1/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          case "$RELEASE_HTTP" in
            404) RELEASE_ID="" ;;
            200) echo 'Release/candidate already exists; refusing all mutations' >&2; exit 1 ;;
            *) echo "Cannot verify candidate absence: HTTP $RELEASE_HTTP" >&2; exit 1 ;;
          esac
          if [ -z "${RELEASE_ID}" ]; then
            RELEASE=$(curl -fsS -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              "http://localhost:7218/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
              -d "{
                \"tag_name\": \"${TAG}\",
                \"name\": \"BOS ${TAG}\",
                \"prerelease\": false,
                \"draft\": true,
                \"body\": \"UNSIGNED DRAFT CANDIDATE. Offline release signer must verify the ISO, sign SHA256SUMS with the separate ISO key, upload SHA256SUMS.asc, and approve publication. See docs/signed-repo.md.\\n\\nSee the [README](https://github.com/Breadway/bos#testing-in-a-vm) for VM testing instructions.\"
              }")
            RELEASE_ID=$(echo "${RELEASE}" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          fi
          echo "Using release ID: ${RELEASE_ID}"

          require_draft() {
            curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" \
              "http://localhost:7218/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("draft") is True else "Candidate is no longer draft, refusing mutation")'
          }

          upload_asset() {
            local file="$1" name
            name="$(basename "$file")"
            require_draft
            # No replacement/deletion: an existing name is an error.
            curl -fsS -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${file};filename=${name}" \
              "http://localhost:7218/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets"
            echo "Uploaded: ${name}"
          }

          upload_asset "/bos-out/${ISO_NAME}"
          upload_asset "/bos-out/SHA256SUMS"
          require_draft
          echo 'Candidate ready only after this workflow completes successfully; offline signer must wait for completion.'

      # Public release publication, GitHub announcement and stable promotion
      # happen only after the offline signer approves this exact candidate.
